<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="FormSubmission.css">
    <title>She Can Foundation</title>
</head>
<body>
<form method="post" action="FormBackend">
    <div class="container">

        <div class="section1">
            <h1>SHE CAN FOUNDATION</h1>
            <h2>Empowering Women & Education</h2>

            <div class="logo">
                <img src="logo.jpg" alt="Logo">
            </div>
        </div>

        <div class="section2">

            <div class="row">
                <label>First Name</label>
                <label>Last Name</label>

                <input type="text" name="fnm">
                <input type="text" name="lnm">
            </div>

            <div class="row">
                <label>Email</label>
                <label>Phone No</label>

                <input type="email" name="email">
                <input type="text" name="phoneNo">
            </div>

            <div class="row">
                <label>Message Field</label>
                <textarea name="message" rows="4"></textarea>
            </div>

            <input type="submit" value="Submit" onclick="return formsubmit()">

        </div>

    </div>
</form>
    <script>
        function formsubmit()
        {
            let fname = document.getElementsByName("fnm")[0].value.trim();
            let lname = document.getElementsByName("lnm")[0].value.trim();
            let email = document.getElementsByName("email")[0].value.trim();
            let phone = document.getElementsByName("phoneNo")[0].value.trim();
            let message = document.getElementsByName("message")[0].value.trim();

            if(fname === "" || lname === "" || email === "" || phone === "" || message === "")
            {
                alert("All fields are required");
                return false;
            }

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if(!emailPattern.test(email))
            {
                alert("Please enter a valid email address");
                return false;
            }

            let phonePattern = /^[0-9]{10}$/;

            if(!phonePattern.test(phone))
            {
                alert("Phone number must contain exactly 10 digits");
                return false;
            }

            alert("Form Submitted Successfully");
            return true;
        }
    </script>

</body>
</html>
